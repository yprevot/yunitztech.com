name: Verify, publish and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Verify production images and browser journeys
        run: bash scripts/verify-production.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
            qa-artifacts/
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [api, web, gateway]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          build-args: RELEASE_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.prefix }}-${{ matrix.target }}:main
            ${{ steps.image.outputs.prefix }}-${{ matrix.target }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          provenance: true
          sbom: true
  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Request deployment from Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          test -n "$COOLIFY_WEBHOOK"
          test -n "$COOLIFY_TOKEN"
          curl --fail-with-body --silent --show-error --retry 3 --max-time 60 \
            --request POST --header "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
      - name: Verify that the new revision is serving traffic
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test -n "$SITE_URL"
          for attempt in $(seq 1 60); do
            revision=$(curl --fail --silent --max-time 10 "$SITE_URL/version.json" | jq -r '.revision' || true)
            if [ "$revision" = "$EXPECTED_SHA" ]; then
              curl --fail --silent --show-error --max-time 15 "$SITE_URL/api/health"
              exit 0
            fi
            sleep 10
          done
          echo 'Coolify has not served the expected revision within 10 minutes.'
          exit 1
