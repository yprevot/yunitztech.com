server {
  listen 8080;
  server_name _;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 6m;
  access_log off;
  error_log /dev/stderr warn;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  gzip on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml;
  location = /health { return 200 'ok'; add_header Content-Type text/plain; }
  location /api/ {
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    # The API trusts only this overwritten value. Never publish the API port.
    # Behind Coolify this is the proxy IP unless trusted real-IP config is enabled.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
  }
  location / {
    set $web_upstream web:4321;
    proxy_pass http://$web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
