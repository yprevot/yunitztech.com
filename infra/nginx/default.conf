server {
  listen 8080;
  server_name _;
  set_real_ip_from ${TRUSTED_PROXY_CIDR};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 6m;
  access_log off;
  error_log /dev/stderr warn;
  include /etc/nginx/security-headers.conf;
  gzip on;
  gzip_types text/css application/javascript application/json application/xml image/svg+xml;
  location = /health {
    include /etc/nginx/security-headers.conf;
    default_type text/plain;
    return 200 'ok';
  }
  location /api/ {
    set $api_upstream api:3000;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $host;
    # The API trusts only this overwritten value. Never publish the API port.
    # Behind Coolify this is the proxy IP unless trusted real-IP config is enabled.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 30s;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
  }
  location / {
    set $web_upstream web:4321;
    proxy_pass http://$web_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }
}
